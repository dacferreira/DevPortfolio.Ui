<svg class="ilustracao" viewBox="0 0 420 300" xmlns="http://www.w3.org/2000/svg" focusable="false">
  <defs>
    <linearGradient id="il-tela" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1c46" />
      <stop offset="1" stop-color="#0a1233" />
    </linearGradient>
    <linearGradient id="il-borda" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6" />
      <stop offset="1" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="il-base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e2b5c" />
      <stop offset="1" stop-color="#0d1533" />
    </linearGradient>
    <filter id="il-brilho" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Brilho no chão -->
  <ellipse cx="210" cy="262" rx="170" ry="16" fill="#3b82f6" opacity="0.25" filter="url(#il-brilho)" />

  <!-- Tela do notebook -->
  <rect x="88" y="52" width="244" height="158" rx="12" fill="url(#il-tela)" stroke="url(#il-borda)" stroke-width="2" filter="url(#il-brilho)" />
  <circle cx="110" cy="70" r="3.5" fill="#f87171" />
  <circle cx="122" cy="70" r="3.5" fill="#fbbf24" />
  <circle cx="134" cy="70" r="3.5" fill="#34d399" />

  <!-- Linhas de código -->
  <g font-family="'Fira Code', Consolas, monospace" font-size="10">
    <text x="106" y="96" fill="#a78bfa">const</text>
    <text x="140" y="96" fill="#60a5fa">dev</text>
    <text x="160" y="96" fill="#e8ecff">= &#123;</text>
    <text x="118" y="114" fill="#9aa6cc">stack:</text>
    <text x="156" y="114" fill="#34d399">['Angular', '.NET'],</text>
    <text x="118" y="132" fill="#9aa6cc">banco:</text>
    <text x="156" y="132" fill="#34d399">'MySQL',</text>
    <text x="118" y="150" fill="#9aa6cc">aprendendo:</text>
    <text x="184" y="150" fill="#fbbf24">true</text>
    <text x="106" y="168" fill="#e8ecff">&#125;;</text>
  </g>
  <rect x="106" y="180" width="58" height="5" rx="2.5" fill="#3b82f6" opacity="0.6" />
  <rect x="170" y="180" width="36" height="5" rx="2.5" fill="#8b5cf6" opacity="0.6" />
  <rect x="106" y="191" width="84" height="5" rx="2.5" fill="#60a5fa" opacity="0.35" />

  <!-- Base do notebook -->
  <path d="M60 214 H360 L380 238 Q382 244 374 244 H46 Q38 244 40 238 Z" fill="url(#il-base)" stroke="url(#il-borda)" stroke-width="1.5" />
  <rect x="186" y="218" width="48" height="6" rx="3" fill="#0a1233" />

  <!-- Angular -->
  <g class="flutuante" transform="translate(42 70)">
    <rect x="-26" y="-26" width="52" height="52" rx="14" fill="#0f1a3d" stroke="#dd0031" stroke-opacity="0.6" filter="url(#il-brilho)" />
    <path d="M0 -16 L15 -10.5 L12.5 9 L0 16 L-12.5 9 L-15 -10.5 Z" fill="#dd0031" />
    <path d="M0 -12 L-8.5 8 H-5.3 L-3.6 3.6 H3.6 L5.3 8 H8.5 Z M0 -4.5 L2.4 1 H-2.4 Z" fill="#fff" />
  </g>

  <!-- .NET -->
  <g class="flutuante flutuante--atraso" transform="translate(376 96)">
    <rect x="-28" y="-26" width="56" height="52" rx="14" fill="#0f1a3d" stroke="#8b5cf6" stroke-opacity="0.7" filter="url(#il-brilho)" />
    <circle cx="0" cy="0" r="17" fill="#512bd4" />
    <text x="0" y="4" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#fff">.NET</text>
  </g>

  <!-- MySQL -->
  <g class="flutuante" transform="translate(352 196)">
    <rect x="-32" y="-20" width="64" height="40" rx="12" fill="#0f1a3d" stroke="#60a5fa" stroke-opacity="0.6" filter="url(#il-brilho)" />
    <text x="0" y="4" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="700">
      <tspan fill="#60a5fa">My</tspan><tspan fill="#f59e0b">SQL</tspan>
    </text>
  </g>

  <!-- Partículas -->
  <circle cx="70" cy="180" r="2" fill="#60a5fa" opacity="0.8" />
  <circle cx="300" cy="30" r="2.5" fill="#a78bfa" opacity="0.8" />
  <circle cx="160" cy="26" r="1.5" fill="#60a5fa" opacity="0.6" />
  <circle cx="395" cy="160" r="1.5" fill="#a78bfa" opacity="0.6" />
</svg>
